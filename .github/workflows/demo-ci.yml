name: Demo build and deploy

on:
  push:
    branches: [codex/demo-product]
    paths-ignore: ['**/*.md', 'demo/evidence/**']
  pull_request:
    branches: [codex/demo-product]
    paths-ignore: ['**/*.md', 'demo/evidence/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/demo-product' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment behavior and demo scripts
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find demo -name '*.mjs' -not -path '*/node_modules/*' -print0)
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find demo -name '*.sh' -print0)
          bash demo/ci/entrypoint.test.sh
          bash demo/ci/gcp-deploy.test.sh
          if compgen -G 'demo/data/*.test.mjs' > /dev/null; then node --test demo/data/*.test.mjs; fi
          git diff --check
      - name: Validate portable deployment
        env:
          TWENTY_IMAGE: ghcr.io/materic-inc/twenty-materic-demo-product:validation
          APP_SECRET: validation-only-never-deployed
          POSTGRES_PASSWORD: validation-only-never-deployed
          ENCRYPTION_KEY: validation-only-never-deployed
          SERVER_URL: https://demo.example.invalid
        run: docker compose --env-file demo/deploy/.env.example -f demo/deploy/compose.yaml config --quiet

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image coordinates
        id: reference
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          app_version=$(node demo/ci/image-version.mjs)
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
      - name: Authenticate container registry
        if: github.ref == 'refs/heads/codex/demo-product' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare strict demo image target
        run: |
          cat packages/twenty-docker/twenty/Dockerfile demo/ci/Dockerfile.append > demo/ci/Dockerfile.generated
      - name: Build this fork's frontend and backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/ci/Dockerfile.generated
          target: materic-demo
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/codex/demo-product' && github.event_name != 'pull_request' }}
          tags: ${{ steps.reference.outputs.image }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ steps.reference.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo-twenty
          cache-to: type=gha,mode=max,scope=demo-twenty
      - name: Save immutable release reference
        if: github.ref == 'refs/heads/codex/demo-product' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$IMAGE@$DIGEST" > demo-image.txt
          echo "### Built fork image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/codex/demo-product' && github.event_name != 'pull_request'
        with:
          name: demo-image
          path: demo-image.txt
          retention-days: 90

  deploy:
    needs: image
    if: github.ref == 'refs/heads/codex/demo-product' && github.event_name != 'pull_request' && vars.DEMO_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: demo
      url: https://twenty-materic-demo-product.materic.inc
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: demo-image
      - name: Authenticate to dedicated GCP project
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy immutable image through IAP
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
          DEMO_SOURCE_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash demo/ci/gcp-deploy.sh
      - name: Install isolated browser smoke tools
        run: |
          npm install --prefix .demo-ci-runtime --no-save --package-lock=false playwright@1.56.1
          .demo-ci-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify running application
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_SMOKE_EMAIL: ${{ secrets.DEMO_SMOKE_EMAIL }}
          DEMO_SMOKE_PASSWORD: ${{ secrets.DEMO_SMOKE_PASSWORD }}
        run: node demo/ci/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-browser-smoke
          path: demo-smoke-artifacts
          if-no-files-found: ignore
