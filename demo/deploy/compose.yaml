name: twenty-stuard-demo-product

x-application: &application
  image: ${TWENTY_IMAGE:-twentycrm/twenty:v2.48.0}
  entrypoint: [/bin/sh, /app/demo-entrypoint.sh]
  restart: unless-stopped
  environment: &application-environment
    NODE_ENV: production
    NODE_PORT: 3000
    SERVER_URL: ${SERVER_URL:?Set the public HTTPS URL}
    PG_DATABASE_URL: postgres://twenty:${POSTGRES_PASSWORD:?Set the database password}@postgres:5432/twenty
    REDIS_URL: redis://redis:6379
    APP_SECRET: ${APP_SECRET:?Set the application secret}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set the encryption key}
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: .local-storage
    EMAIL_DRIVER: logger
    IS_EMAIL_VERIFICATION_REQUIRED: "false"
    IS_MULTIWORKSPACE_ENABLED: "false"
    IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
    SIGN_IN_PREFILLED: "false"
    TELEMETRY_ENABLED: "false"
  volumes:
    - uploads:/app/packages/twenty-server/.local-storage
    - ./entrypoint.sh:/app/demo-entrypoint.sh:ro
  networks:
    - internal

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U twenty -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  server:
    <<: *application
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

  worker:
    <<: *application
    command: [yarn, "worker:prod"]
    environment:
      <<: *application-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TWENTY_HOST: ${TWENTY_HOST:?Set the DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres:
  redis:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
